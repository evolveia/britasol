<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#E54E00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Orange Background with Rounded Corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="480" height="480" x="16" y="16" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Centered Swirl Emblem of Britasol -->
  <g transform="translate(256, 210) scale(1.3)" filter="url(#shadow)">
    <!-- Green Arc (Top Left) -->
    <path d="M 0 -85 A 85 85 0 0 1 73 -42 C 55 -15 25 -5 0 0 C -25 5 -55 -15 -73 -42 A 85 85 0 0 1 0 -85 Z" fill="#00A859"/>
    <!-- Blue Arc (Top Right / Right) -->
    <path d="M 73 -42 A 85 85 0 0 1 73 42 C 45 35 15 25 0 0 C 25 -5 55 -15 73 -42 Z" fill="#0077C8"/>
    <!-- Grey Arc (Bottom) -->
    <path d="M 73 42 A 85 85 0 0 1 -73 42 C -50 15 -25 5 0 0 C 15 25 45 35 73 42 Z" fill="#8E9398"/>
    <!-- Orange Center Spiral Core -->
    <circle cx="0" cy="0" r="28" fill="#F95700"/>
  </g>

  <!-- Bold White 'B' Lettermark Base -->
  <text x="256" y="440" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="140" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" filter="url(#shadow)">B</text>
</svg>
