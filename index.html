    <!-- Silence Vite HMR WebSocket proxy disconnect warnings in AI Studio preview environments -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('vite') !== -1) {
              event.preventDefault();
            }
          });
        }
      })();
    </script>

    <!-- Ensure window.fetch is writable and configurable so test executors and browser extensions can wrap/reassign fetch -->
    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _activeFetch = _origFetch;
          
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _activeFetch;
            },
            set: function(fn) {
              _activeFetch = fn;
            }
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _activeFetch;
                },
                set: function(fn) {
                  _activeFetch = fn;
                }
              });
            } catch (_errProto) {}
          }
        } catch (_err) {}
      })();
    </script>
